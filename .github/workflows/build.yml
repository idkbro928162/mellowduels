name: Build BasedDuels

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: BasedDuels
          path: target/BasedDuels.jar
