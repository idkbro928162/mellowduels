name: MellowDuels
version: '${project.version}'
main: net.mellowsmp.duels.MellowDuels
api-version: '1.21'
folia-supported: false
author: MellowSMP
description: Automatic-arena PvP dueling system with kits, queues, spectating and stats.

commands:
  duel:
    description: Challenge players, queue for a kit, spectate, or view stats
    usage: /duel <player|accept|deny|queue|leave|spectate|stats|top|gui|help>
    aliases: [duels]
    permission: mellowduels.use
    permission-message: You do not have permission to use duels.
  dueladmin:
    description: Admin commands for MellowDuels
    usage: /dueladmin <arena|kit|reload>
    permission: mellowduels.admin
    permission-message: You do not have permission to manage duels.

permissions:
  mellowduels.use:
    description: Allows use of basic duel commands
    default: true
  mellowduels.admin:
    description: Allows management of arenas, kits and plugin settings
    default: op
